server:
  port: 8080


spring:
  profiles:
    active: dev
  application:
    name: backend
  datasource:
    driver-class-name: ${blog.datasource.driver-class-name}
    url: jdbc:mysql://${blog.datasource.host}:${blog.datasource.port}/${blog.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${blog.datasource.username}
    password: ${blog.datasource.password}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.asuka.backend.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 只保留这些干净的 springdoc 配置
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    enabled: true
    path: /v3/api-docs
blog:
  jwt:
    admin-secret-key: ${blog.jwt.admin-secret-key}
  formula:
    backfill:
      enabled: ${BLOG_FORMULA_BACKFILL_ENABLED:false}
    font-size: ${BLOG_FORMULA_FONT_SIZE:20}
    dpi: ${BLOG_FORMULA_DPI:150}
    render-version: ${BLOG_FORMULA_RENDER_VERSION:2}
    oss-endpoint: ${BLOG_OSS_ENDPOINT:}
    oss-region: ${BLOG_OSS_REGION:}
    oss-bucket: ${BLOG_OSS_BUCKET:}
    oss-access-key-id: ${BLOG_OSS_ACCESS_KEY_ID:${OSS_ACCESS_KEY_ID:}}
    oss-access-key-secret: ${BLOG_OSS_ACCESS_KEY_SECRET:${OSS_ACCESS_KEY_SECRET:}}
    public-base-url: ${BLOG_OSS_PUBLIC_BASE_URL:}
    object-prefix: ${BLOG_OSS_OBJECT_PREFIX:blog/formulas}
